[project]
name = "opspilot-backend"
version = "0.1.0"
description = "OpsPilot backend (modular monolith)"
readme = "README.md"
authors = [
    { name = "awoladhossain", email = "awoladh04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.107",
    "celery>=5.6.3",
    "fastapi>=0.142.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

# [project.scripts]
# backend = "backend:main"

# [build-system]
# requires = ["uv_build>=0.12.22,<0.13.0"]
# build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"
